[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
callback_result_format = yaml
host_key_checking = True
forks = 5
# Run notified handlers even when a later task fails, so a changed config is never left unapplied.
force_handlers = True
# Vault password: pass --ask-vault-pass, or point this at a file outside the repo.
# vault_password_file = ~/.ansible/homelab-vault-pass

[ssh_connection]
pipelining = True
