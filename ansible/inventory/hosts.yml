---
# Real public IPs live in the encrypted vault, not here.
# Since stage B (SSH over wg-mgmt only) Ansible reaches the servers through the tunnel.
# Break-glass if the tunnel is down: the provider's web console.
all:
  children:
    vps:
      hosts:
        s1-msk:
          ansible_host: 10.99.0.11
        s2-lt:
          ansible_host: 10.99.0.12
    staging:
      hosts:
        vm-staging:
          ansible_host: 192.168.0.70   # static, set after install (runbook 03)
    home:
      hosts:
        # The control node. For now this is the WSL Ubuntu on the home PC itself (Ansible runs
        # here); a Hyper-V VM can take over the same identity later. Run as root:
        #   wsl -u root ... ansible-playbook site.yml -l vm-ctl --tags wg_mgmt
        vm-ctl:
          ansible_connection: local
    # Everything that runs the edge roles: the real servers plus the staging copy.
    edge:
      children:
        vps:
        staging:
    # Tunnel peers Ansible never connects to (configured by hand in their own WireGuard app).
    # They exist here only so the servers' peer lists include them. No play targets this group.
    wg_external:
      hosts:
        win-home:
    # Members of the management WireGuard network (10.99.0.0/24).
    wg_mgmt:
      children:
        vps:
        staging:
        home:
        wg_external:
