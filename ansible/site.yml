---
# Usage (always one host at a time, staging first):
#   ansible-playbook site.yml -l vm-staging
#   ansible-playbook site.yml -l s2-lt --check --diff
#   ansible-playbook site.yml -l s2-lt
# (vault password from ANSIBLE_VAULT_PASSWORD_FILE, or add --ask-vault-pass)

- name: Edge servers (VPS and staging copy)
  hosts: edge
  become: true
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: wg_mgmt
      tags: [wg_mgmt]
    - role: firewall
      tags: [firewall]
    - role: node_exporter
      tags: [node_exporter]
    - role: xui
      tags: [xui]
    - role: adguard
      tags: [adguard]
      when: adguard_enabled | default(false)
    - role: decoy_site          # fake site on 443, Reality self-steal target (ADR 0006)
      tags: [decoy_site]
      when: decoy_enabled | default(false)
    - role: backup
      tags: [backup]
    - role: dns_identity        # installs or removes itself (dns_identity_enabled)
      tags: [dns_identity]
    - role: blackbox_exporter
      tags: [blackbox, monitoring]
      when: blackbox_enabled | default(false)
    - role: monitoring
      tags: [monitoring]
      when: monitoring_enabled | default(false)
    - role: watcher
      tags: [watcher, monitoring]
      when: watcher_enabled | default(false)
    - role: geodata             # nightly block-list refresh for Xray (ADR 0008)
      tags: [geodata]
      when: geodata_enabled | default(false)
    - role: reach               # website reachability agent (ADR 0007)
      tags: [reach]
      when: reach_enabled | default(false)
    - role: reach_bot           # Telegram /check and /sites, monitoring host only
      tags: [reach, reach_bot]
      when: reach_bot_enabled | default(false)

- name: Home control node
  hosts: home
  become: true
  roles:
    - role: common
      tags: [common]
    - role: wg_mgmt
      tags: [wg_mgmt]
    - role: grafana
      tags: [grafana]
    - role: recovery_kit
      tags: [recovery_kit]
