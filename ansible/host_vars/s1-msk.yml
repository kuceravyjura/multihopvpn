---
# Server 1 · Moscow · Debian 12 · 1 vCPU / 512 MB
# Ports from the 2026-11-21 inventory (docs/inventory/s1-msk.md).

wg_mgmt_ip: 10.99.0.11
wg_mgmt_endpoint: "{{ vault_s1_public_ip }}:{{ wg_mgmt_port }}"
wg_mgmt_public_key: "r8IL5n2yvluSiRN1VGoxabllHRtGXwCISCLvUzlhM2A="

# A 1 GB swap file already exists; zram would only add a second swap layer.
zram_enabled: false

# No wg-easy here (users are on Xray WireGuard inbounds, which run in userspace).
common_ip_forward: false

# Firewall on since 2026-11-22 (stage A); SSH over wg-mgmt only since stage B, same day. Ports re-checked against live listeners.
firewall_enabled: true
firewall_ssh_public: false         # stage B: SSH over wg-mgmt only (home peers: win-home, vm-ctl)
firewall_public_tcp:
  - 80      # acme.sh standalone renewal of the IP certificate (6-day certs, renewed every few days)
  - 8443    # vless + Reality (tcp)
  - 11139   # vless + Reality (xhttp)
firewall_public_udp:               # Xray WireGuard inbounds. Keep in sync with the panel.
  - 11757
  - 22387
  - 27975
  - 31667
  - 32526
  - 33540
  - 38897
  - 44877
  - 45043
  - 48034
  - 53621
  - 56214
  - 57265
firewall_mgmt_tcp:
  - 6902    # 3x-ui panel
  - 2096    # 3x-ui subscriptions: not used by clients (configs rarely change)

# Server 2's address may reach this panel. Originally for the panel node link (links are off
# since the 2026-11-22 incident); kept on purpose as the owner's second way in: phone on a
# Server 2 VPN profile -> this panel on 6902. Still needs the secret path + login.
firewall_extra_rules:
  - 'ip saddr {{ vault_s2_public_ip }} tcp dport 6902 accept'

# Phase 6: probes Server 2 from Moscow (scraped by Server 2's Prometheus over wg-mgmt), and
# watches Server 2's monitoring itself: if it is gone, push to ntfy.sh (Telegram is IP-blocked here).
blackbox_enabled: true
watcher_enabled: true
watcher_targets:
  - {name: server2-prometheus, url: "http://10.99.0.12:9090"}

# Reachability agent (ADR 0007): direct from Moscow, and the "user" path through this panel's own
# routing via the local probe inbound 127.0.0.1:10808 (scripts/xui-local-probe-inbound.py).
reach_enabled: true
reach_socks: "127.0.0.1:10808"

# Nightly refresh of Russia's block list (geosite_RU.dat, runetfreedom) for the relay rule
# "Relay: Russia's block list" (scripts/xray-relay-blocklist.py). The hand-made list stays first.
geodata_enabled: true
