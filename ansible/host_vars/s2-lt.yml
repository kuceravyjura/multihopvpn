---
# Server 2 · Lithuania · Ubuntu 24.04 · 1 vCPU / 1 GB
# Ports from the 2026-11-21 inventory (docs/inventory/s2-lt.md).

wg_mgmt_ip: 10.99.0.12
wg_mgmt_endpoint: "{{ vault_s2_public_ip }}:{{ wg_mgmt_port }}"
wg_mgmt_public_key: "fAIEK4OQy+cTdUTWSL/8ijL+tH8h2JWOyCNhcE+y00Y="

common_ip_forward: true            # wg-easy (Docker). false after it is retired.

# Helpers from the Ubuntu image that a VPS doesn't use (~30-50 MB RAM together).
common_disable_services:
  - ModemManager
  - multipathd
  - udisks2
  - upower

# Firewall on since 2026-11-22 (stage A); SSH over wg-mgmt only since stage B, same day. Ports re-checked against live listeners.
firewall_enabled: true
firewall_ssh_public: false         # stage B: SSH over wg-mgmt only (home peers: win-home, vm-ctl)
firewall_public_tcp:
  - 80      # nginx decoy site (+ certificate renewal)
  - 443     # nginx decoy site: makes the server look like an ordinary web host
  - 853     # AdGuard DNS-over-TLS
  - 1111    # vless + Reality (xhttp), hop from Server 1
  - 3452    # AdGuard DNS-over-HTTPS
  - 8443    # vless + Reality (tcp)
firewall_public_udp:
  - 3452    # DoH over HTTP/3
  - 51820   # wg-easy (until retired)
  - 12580   # Xray WireGuard inbounds from here down
  - 26683
  - 30547
  - 31737
  - 38311
  - 44841
  - 56539
  - 57158
firewall_mgmt_tcp:
  - 3000    # AdGuard web UI
  - 6903    # 3x-ui panel
  - 2096    # 3x-ui subscriptions: not used by clients

# Published by Docker: they bypass the input chain, so they are filtered in forward.
# (portainer 8000/9443 and homer 8080 were removed on 2026-11-21)
firewall_docker_mgmt_ports:
  - 51821   # wg-easy UI

firewall_extra_rules:
  # wg-easy clients query AdGuard through the Docker bridge.
  - 'iifname "docker0" meta l4proto { tcp, udp } th dport 53 accept'
  - 'iifname "br-*" meta l4proto { tcp, udp } th dport 53 accept'
  # Server 1's address may reach this panel. Originally for the panel node link (links are off
  # since the 2026-11-22 incident); kept on purpose as the owner's second way in: phone on a
  # Server 1 VPN profile -> https://<s2-domain>:6903/<path>. Still needs the secret path + login.
  - 'ip saddr {{ vault_s1_public_ip }} tcp dport 6903 accept'

adguard_enabled: true

# Fake site on 443 (replaces the stock "Welcome to nginx" page); also the Reality target of the
# relay inbound, so the relay's name, address and certificate all belong to this server (ADR 0006).
decoy_enabled: true
decoy_domain: "{{ vault_s2_domain }}"

# ADR 0004 (deferred): per-user DNS identity would remove Server 1's DNS fallback.
# Reliability first: everyone stays srv1-moscow. The role removes the route while false.
dns_identity_enabled: false

# Phase 6: Server 2 is the monitoring server (always on). Grafana at home reads it over wg-mgmt.
blackbox_enabled: true
monitoring_enabled: true
monitoring_env: prod
monitoring_node_targets: [s1-msk, s2-lt]
# Reachability (ADR 0007): agent here (direct from Lithuania), scrape both agents, and the
# Telegram bot (/check, /sites) on this host, where Telegram is reachable.
reach_enabled: true
reach_bot_enabled: true
monitoring_reach_targets: [s1-msk, s2-lt]
# Traffic per inbound/client (ADR 0009): exporter here, scrape both.
xui_exporter_enabled: true
monitoring_xui_targets: [s1-msk, s2-lt]
# Server 1's public services checked from Lithuania, Server 2's from Moscow (both directions of
# the user path). Addresses and the domain come from the vault.
monitoring_probes:
  - {name: s1-vless-8443, prober: s2-lt, module: tcp_connect, target: "{{ vault_s1_public_ip }}:8443"}
  - {name: s1-vless-11139, prober: s2-lt, module: tcp_connect, target: "{{ vault_s1_public_ip }}:11139"}
  - name: s1-panel-cert
    prober: s2-lt
    module: https_reachable
    target: "https://{{ vault_s1_public_ip }}:6902/"
    cert: shortlived
  - {name: s2-vless-8443, prober: s1-msk, module: tcp_connect, target: "{{ vault_s2_public_ip }}:8443"}
  - {name: s2-relay-1111, prober: s1-msk, module: tcp_connect, target: "{{ vault_s2_public_ip }}:1111"}
  - {name: s2-dot-853, prober: s1-msk, module: tcp_connect, target: "{{ vault_s2_public_ip }}:853"}
  - name: s2-doh
    prober: s1-msk
    module: doh
    target: "https://{{ vault_s2_domain }}:3452/dns-query?dns=AAABAAABAAAAAAAAB2V4YW1wbGUDY29tAAABAAE"
    cert: normal
  - name: s2-decoy-site
    prober: s1-msk
    module: https_reachable
    target: "https://{{ vault_s2_domain }}/"
    cert: normal
  # The relay's camouflage, probed from Moscow with the relay's name, as a censor would see it:
  # must be the fake site over TLS 1.3 + HTTP/2. A plain TCP check misses a broken target (ADR 0006).
  - name: s2-relay-camouflage
    prober: s1-msk
    module: reality_target
    target: "https://{{ vault_s2_domain }}:1111/"

# WireGuard users created by the bot (ADR 0010): one UDP range instead of a port per person.
firewall_user_udp_range: "20000-29999"
