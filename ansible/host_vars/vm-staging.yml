---
# Hyper-V VM that imitates Server 1 (give it 512 MB RAM, same OS version).
# Every role runs here before it touches a real server.

wg_mgmt_ip: 10.99.0.21
wg_mgmt_endpoint: "{{ ansible_host }}:{{ wg_mgmt_port }}"
wg_mgmt_public_key: "/HRFPWKKACuD0TVat04yedF8qtZym7+1Zsfv1QZM020="

zram_enabled: true
zram_size_mb: 256
common_ip_forward: false

firewall_enabled: true
firewall_ssh_public: true
# Restored copy of Server 2 (phase 3 proof): same public ports, admin UIs over wg-mgmt.
firewall_public_tcp: [80, 443, 853, 1111, 3452, 8443]
firewall_public_udp: [3452, 51820]   # 51820: wg-easy migration rehearsal (phase 5)
firewall_mgmt_tcp: [2053, 2096, 3000, 6903]

# Restore Server 2's state from a backup pulled home (backups/ is git-ignored).
# Extract the latest archive into backups/restore/s2-lt/ first (runbook 04).
adguard_enabled: true
xui_restore_db: "{{ playbook_dir }}/../backups/restore/s2-lt/x-ui.db"
adguard_restore_config: "{{ playbook_dir }}/../backups/restore/s2-lt/AdGuardHome.yaml"
# Server 2's certificates are not copied to staging; stand-ins keep the services starting.
xui_selfsigned_if_missing: true
adguard_selfsigned_if_missing: true
decoy_enabled: true
decoy_domain: "{{ vault_s2_domain }}"
decoy_selfsigned_if_missing: true

# ADR 0004: 10.53.0.N is local here, so AdGuard sees each user's DNS address as the client.
dns_identity_enabled: true

# Phase 6 rehearsal: staging monitors itself like Server 2 will monitor both servers.
blackbox_enabled: true
monitoring_enabled: true
monitoring_env: staging
monitoring_node_targets: [vm-staging]
monitoring_probes:
  - {name: staging-vless-8443, prober: vm-staging, module: tcp_connect, target: "192.168.0.70:8443"}
  - {name: staging-relay-1111, prober: vm-staging, module: tcp_connect, target: "192.168.0.70:1111"}
  - {name: staging-dot-853, prober: vm-staging, module: tcp_connect, target: "192.168.0.70:853"}
  # DoH query for example.com (wire format, base64url) through staging's AdGuard.
  - name: staging-doh
    prober: vm-staging
    module: doh_insecure
    target: "https://192.168.0.70:3452/dns-query?dns=AAABAAABAAAAAAAAB2V4YW1wbGUDY29tAAABAAE"
  # The relay's camouflage: what a probe sees on 1111 with the right name (ADR 0006).
  - name: staging-relay-camouflage
    prober: vm-staging
    module: reality_target_insecure
    target: "https://192.168.0.70:1111/"
# Staging is often off or under test: no Telegram, no watcher. For a delivery test, run with
# -e alertmanager_telegram_bot_token={{ vault_telegram_bot_token }} (watcher: see runbook 07).
alertmanager_telegram_bot_token: ""
watcher_enabled: false

# Reachability agent (ADR 0007): direct, and through staging's own Xray routing via the local
# probe inbound (scripts/xui-local-probe-inbound.py). No bot here: one bot token, one poller.
reach_enabled: true
reach_socks: "127.0.0.1:10808"
geodata_enabled: true
reach_interval: 300
monitoring_reach_targets: [vm-staging]

xui_exporter_enabled: true
monitoring_xui_targets: [vm-staging]
