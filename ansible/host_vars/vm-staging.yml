---
# Hyper-V VM that imitates Server 1 (give it 512 MB RAM, same OS version).
# Every role runs here before it touches a real server.

wg_mgmt_ip: 10.99.0.21
wg_mgmt_endpoint: "{{ ansible_host }}:{{ wg_mgmt_port }}"
wg_mgmt_public_key: "/HRFPWKKACuD0TVat04yedF8qtZym7+1Zsfv1QZM020="

zram_enabled: true
zram_size_mb: 256
common_ip_forward: false

firewall_enabled: true
firewall_ssh_public: true
# Restored copy of Server 2 (phase 3 proof): same public ports, admin UIs over wg-mgmt.
firewall_public_tcp: [80, 443, 853, 1111, 3452, 8443]
firewall_public_udp: [3452, 51820]   # 51820: wg-easy migration rehearsal (phase 5)
firewall_mgmt_tcp: [2053, 2096, 3000, 6903]

# Restore Server 2's state from a backup pulled home (backups/ is git-ignored).
# Extract the latest archive into backups/restore/s2-lt/ first (runbook 04).
adguard_enabled: true
xui_restore_db: "{{ playbook_dir }}/../backups/restore/s2-lt/x-ui.db"
adguard_restore_config: "{{ playbook_dir }}/../backups/restore/s2-lt/AdGuardHome.yaml"
# Server 2's certificates are not copied to staging; stand-ins keep the services starting.
xui_selfsigned_if_missing: true
adguard_selfsigned_if_missing: true

# ADR 0004: 10.53.0.N is local here, so AdGuard sees each user's DNS address as the client.
dns_identity_enabled: true
