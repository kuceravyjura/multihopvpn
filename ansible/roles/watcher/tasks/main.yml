---
- name: Check the push topic is set
  ansible.builtin.assert:
    that: (vault_ntfy_topic | default('')) | length > 8
    fail_msg: vault_ntfy_topic is missing from the vault.
    quiet: true

- name: Watcher script
  ansible.builtin.template:
    src: homelab-watcher.py.j2
    dest: /usr/local/sbin/homelab-watcher
    owner: root
    group: root
    mode: "0750"

- name: Targets
  ansible.builtin.copy:
    dest: /etc/homelab-watcher.json
    content: "{{ watcher_targets | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Push URL (holds the secret topic)
  ansible.builtin.copy:
    dest: /etc/homelab-watcher.env
    content: "NTFY_URL={{ watcher_ntfy_url }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: homelab-watcher.service
      content: |
        # Managed by Ansible (role: watcher)
        [Unit]
        Description=Check that the monitoring server is alive (dead man's switch)
        After=wg-quick@{{ wg_mgmt_interface }}.service

        [Service]
        Type=oneshot
        EnvironmentFile=/etc/homelab-watcher.env
        ExecStart=/usr/local/sbin/homelab-watcher
        MemoryMax=32M
    - name: homelab-watcher.timer
      content: |
        # Managed by Ansible (role: watcher)
        [Unit]
        Description=Run the monitoring watcher every minute

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min
        AccuracySec=10s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for watcher

- name: Apply systemd changes before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable the watcher timer
  ansible.builtin.systemd_service:
    name: homelab-watcher.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
