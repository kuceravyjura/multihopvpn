---
# Grafana on the home control node (WSL Ubuntu, vm-ctl). Viewing only: the data lives in
# Server 2's Prometheus, so a PC that was off all night still shows complete graphs.
grafana_listen_addr: 127.0.0.1          # the Windows browser reaches it via WSL's localhost forwarding
grafana_port: 3000
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_prometheus_url: "http://{{ hostvars['s2-lt'].wg_mgmt_ip }}:9090"
