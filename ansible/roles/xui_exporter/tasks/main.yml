---
- name: Exporter script
  ansible.builtin.copy:
    src: homelab-xui-exporter.py
    dest: /usr/local/sbin/homelab-xui-exporter
    owner: root
    group: root
    mode: "0755"
  notify: Restart homelab-xui-exporter

- name: Exporter configuration
  ansible.builtin.copy:
    dest: /etc/homelab-xui-exporter.json
    content: "{{ {'listen': xui_exporter_listen, 'port': xui_exporter_port | int, 'db': '/etc/x-ui/x-ui.db'} | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homelab-xui-exporter

# Root, because x-ui.db is root-only (it holds every client key). Everything else is locked down;
# /etc/x-ui stays writable only because SQLite readers of a WAL database need the -shm file.
- name: Service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-xui-exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: xui_exporter)
      [Unit]
      Description=3x-ui traffic exporter (homelab-xui-exporter)
      Wants=wg-quick@{{ wg_mgmt_interface }}.service
      After=network-online.target wg-quick@{{ wg_mgmt_interface }}.service x-ui.service

      [Service]
      ExecStart=/usr/bin/python3 /usr/local/sbin/homelab-xui-exporter
      Restart=always
      RestartSec=10
      MemoryMax=50M
      NoNewPrivileges=yes
      ProtectSystem=strict
      ReadWritePaths=/etc/x-ui
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      CapabilityBoundingSet=
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

      [Install]
      WantedBy=multi-user.target
  notify: Restart homelab-xui-exporter

- name: Exporter running
  ansible.builtin.systemd_service:
    name: homelab-xui-exporter
    state: started
    enabled: true
    daemon_reload: true
