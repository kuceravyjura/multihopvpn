---
# Managed by Ansible (role: monitoring). Alert rules for the homelab.
groups:
  - name: homelab
    rules:
      # Always firing. Server 1's watcher checks it is there every minute; if Prometheus stops
      # evaluating rules (or is gone), the watcher pushes to ntfy (dead man's switch, role: watcher).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Monitoring pipeline is alive

      # host!="" : only targets from our config. The package's default config (scraped once at
      # install, before ours is in place) has localhost:9100 without a host label: ignore it.
      - alert: HostDown
        expr: up{job="node", host!=""} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} unreachable over wg-mgmt (server or tunnel down)"

      - alert: ServiceDown
        expr: node_systemd_unit_state{state="active"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is not running on {{ $labels.host }}"

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.probe }} failed (checked from {{ $labels.prober }})"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk on {{ $labels.host }} is {{ $value | humanizePercentage }} full"

      - alert: MemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.host }} is {{ $value | humanizePercentage }} used"

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{cert="normal"} - time()) / 86400 < 14
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Certificate for {{ $labels.probe }} expires in {{ $value | humanize }} days"

      # Server 1's IP certificate lives 6 days and renews every few days: warn only when renewal failed.
      - alert: ShortCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{cert="shortlived"} - time()) / 86400 < 1.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Short-lived certificate for {{ $labels.probe }} expires in {{ $value | humanize }} days (renewal failing?)"

  - name: backups
    rules:
      # Nightly backup at 03:40 (+10 min). Two missed runs in a row are not allowed to go unnoticed.
      - alert: BackupStale
        expr: time() - homelab_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No successful nightly backup on {{ $labels.host }} for {{ $value | humanizeDuration }}"

      - alert: BackupTooSmall
        expr: homelab_backup_last_size_bytes < 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Newest backup on {{ $labels.host }} is only {{ $value | humanize1024 }}B (files missing?)"

      # The home PC reports each Google Drive upload of the recovery kit to Server 2 (job "node", host s2-lt).
      - alert: RecoveryKitStale
        expr: time() - homelab_kit_last_upload_timestamp_seconds > 3 * 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Recovery kit not uploaded to Google Drive for {{ $value | humanizeDuration }} (PC off or upload failing)"

      # The monthly restore drill (runbook 09) records its date the same way. (reach rules below)
      - alert: RestoreDrillOverdue
        expr: time() - homelab_restore_drill_last_timestamp_seconds > 35 * 86400
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Monthly restore drill is due (last one {{ $value | humanizeDuration }} ago)"

  # Website reachability (role "reach", ADR 0007). Agents check the watched list every 10 minutes:
  # Server 1 directly and through its own routing ("user" path), Server 2 directly.
  - name: reach
    rules:
      # The one that needs action: users can't open a site that Lithuania can, i.e. it is blocked in
      # Russia and not on the relay list (or the relay is broken).
      - alert: SiteBlockedForUsers
        expr: |
          homelab_reach_up{host="s1-msk", path="user"} == 0
          and on(site) homelab_reach_up{host="s2-lt", path="direct"} == 1
        for: 25m
        labels:
          severity: warning
        annotations:
          summary: "Server 1's users can't open {{ $labels.site }}, Lithuania can: add it to the relay list (/check {{ $labels.site }})"

      # Changes compared with a day ago, for information: what to add to or drop from the relay list.
      - alert: SiteNowBlockedInRussia
        expr: |
          homelab_reach_up{host="s1-msk", path="direct"} == 0
          and homelab_reach_up{host="s1-msk", path="direct"} offset 1d == 1
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.site }} became blocked directly from Moscow (it worked a day ago)"

      - alert: SiteNowOpenInRussia
        expr: |
          homelab_reach_up{host="s1-msk", path="direct"} == 1
          and homelab_reach_up{host="s1-msk", path="direct"} offset 1d == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.site }} opens directly from Moscow again (blocked a day ago): the relay may no longer be needed for it"

      - alert: ReachAgentDown
        expr: up{job="reach"} == 0 or time() - homelab_reach_last_run_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Reachability agent on {{ $labels.host }} is not answering or not checking"

      # Nightly block-list refresh on Server 1 (role geodata, ADR 0008).
      - alert: BlockListStale
        expr: |
          homelab_geodata_last_check_ok == 0
          or time() - homelab_geodata_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Block-list refresh on {{ $labels.host }} failed or has not run for 2 days (the relay list goes stale)"

      # 3x-ui traffic exporter (role xui_exporter, ADR 0009).
      - alert: TrafficExporterDown
        expr: up{job="xui"} == 0 or xui_exporter_up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Traffic exporter on {{ $labels.host }} is down or cannot read the panel database"
