---
# Managed by Ansible (role: monitoring). Alert rules for the homelab.
groups:
  - name: homelab
    rules:
      # Always firing. Server 1's watcher checks it is there every minute; if Prometheus stops
      # evaluating rules (or is gone), the watcher pushes to ntfy (dead man's switch, role: watcher).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Monitoring pipeline is alive

      # host!="" : only targets from our config. The package's default config (scraped once at
      # install, before ours is in place) has localhost:9100 without a host label: ignore it.
      - alert: HostDown
        expr: up{job="node", host!=""} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} unreachable over wg-mgmt (server or tunnel down)"

      - alert: ServiceDown
        expr: node_systemd_unit_state{state="active"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is not running on {{ $labels.host }}"

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.probe }} failed (checked from {{ $labels.prober }})"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk on {{ $labels.host }} is {{ $value | humanizePercentage }} full"

      - alert: MemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.host }} is {{ $value | humanizePercentage }} used"

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{cert="normal"} - time()) / 86400 < 14
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Certificate for {{ $labels.probe }} expires in {{ $value | humanize }} days"

      # Server 1's IP certificate lives 6 days and renews every few days: warn only when renewal failed.
      - alert: ShortCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{cert="shortlived"} - time()) / 86400 < 1.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Short-lived certificate for {{ $labels.probe }} expires in {{ $value | humanize }} days (renewal failing?)"

  - name: backups
    rules:
      # Nightly backup at 03:40 (+10 min). Two missed runs in a row are not allowed to go unnoticed.
      - alert: BackupStale
        expr: time() - homelab_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No successful nightly backup on {{ $labels.host }} for {{ $value | humanizeDuration }}"

      - alert: BackupTooSmall
        expr: homelab_backup_last_size_bytes < 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Newest backup on {{ $labels.host }} is only {{ $value | humanize1024 }}B (files missing?)"

      # The home PC reports each Google Drive upload of the recovery kit to Server 2 (job "node", host s2-lt).
      - alert: RecoveryKitStale
        expr: time() - homelab_kit_last_upload_timestamp_seconds > 3 * 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Recovery kit not uploaded to Google Drive for {{ $value | humanizeDuration }} (PC off or upload failing)"

      # The monthly restore drill (runbook 09) records its date the same way.
      - alert: RestoreDrillOverdue
        expr: time() - homelab_restore_drill_last_timestamp_seconds > 35 * 86400
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Monthly restore drill is due (last one {{ $value | humanizeDuration }} ago)"
